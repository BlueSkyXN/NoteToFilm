<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>代码动画</title>
<style>
  /* 需要跨机器一致的字体时，把字体文件放进 fonts/ 并在这里声明，例如：
     @font-face { font-family: "Body"; src: url(fonts/Body.woff2) format("woff2"); } */
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// 先声明未就绪：web-render 看到页面写了 READY 赋值，会等到 READY === true 才截图。
window.READY = false;
// 示例：同位对照——固定基准与尺度，让差异成为唯一变化。替换内容、数值和样式，保留 render(t) 的写法。
import { DUR, BEATS } from './timing.js';
import { seg, ease, glide, lerp, drawPath, reveal, wrapText, drawLines, countUp, loadFonts } from './motion.js';
import { ctx, DW, base, faded, text, font } from './kit.js';

// 数值与文字来自材料，注明事实编号；没有依据的数字不要放进画面。
const DATA = { title: '同一基准下比较', a: { label: '标准', value: 100 }, b: { label: '实际', value: 82 }, unit: '%', source: 'F01' };

// 以下坐标都是设计像素（短边 720，见 kit.js），不用乘缩放系数。
const C = { paper: '#F2F0EA', ink: '#1E2328', muted: '#8A9096', a: '#3C6E91', b: '#C0533A' };
const left = 160, right = DW - 160, scaleMax = 120;
const x = v => lerp(left, right, v / scaleMax);

window.DUR = DUR;
window.render = t => {
  base(C.paper);

  // 讲解对象：先认出在比较什么
  faded(ease.outCubic(seg(t, BEATS.title, BEATS.title + 0.4)), () => {
    ctx.fillStyle = C.ink; ctx.font = font(40, 700);
    drawLines(ctx, wrapText(ctx, DATA.title, right - left), left, 120);
  });

  // 共同基准：刻度线沿路径画出
  drawPath(ctx, [[left, 470], [right, 470]], glide(seg(t, BEATS.baseline, BEATS.baseline + 0.7)), { width: 2, color: C.muted });

  // A、B 在同一尺度上依次显露
  const bar = (y, item, color, at) => {
    const k = ease.inOutCubic(seg(t, at, at + 0.8));
    reveal(ctx, [left, y, x(item.value) - left, 70], k, () => { ctx.fillStyle = color; ctx.fillRect(left, y, x(item.value) - left, 70); });
    text(`${item.label}  ${countUp(0, item.value, k)}${DATA.unit}`, left, y - 14, 26, { color: C.ink, alpha: seg(t, at + 0.5, at + 0.9) });
  };
  bar(250, DATA.a, C.a, BEATS.first);
  bar(380, DATA.b, C.b, BEATS.second);

  // 差异：沿 A 的终点对齐，只标出 B 缺少的那一段
  const g = seg(t, BEATS.gap, BEATS.gap + 0.6);
  if (g > 0) {
    const y = 380, h = 70, x0 = x(DATA.b.value), x1 = x(DATA.a.value);
    ctx.save(); ctx.setLineDash([6, 6]);
    drawPath(ctx, [[x1, 250], [x1, 470]], glide(g), { width: 2, color: C.muted });
    reveal(ctx, [x0, y, x1 - x0, h], glide(g), () => {
      ctx.strokeStyle = C.b; ctx.lineWidth = 3; ctx.strokeRect(x0 + 1.5, y + 1.5, x1 - x0 - 3, h - 3);
    });
    ctx.restore();
    text(`相差 ${DATA.a.value - DATA.b.value}${DATA.unit}`, x1 + 18, y + h / 2 + 10, 28, { weight: 700, color: C.b, alpha: seg(t, BEATS.gap + 0.4, BEATS.gap + 0.8) });
  }
};

await loadFonts([font(40, 700), font(26), font(28, 700)]);
window.render(0);
window.READY = true;
</script>
</body>
</html>
